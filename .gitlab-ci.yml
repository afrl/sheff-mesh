include:
  - project: 'sheff/sheff_gitlab_ci'
    ref: main
    file: 'setup_build.yml'
  - project: 'sheff/sheff_gitlab_ci'
    ref: main
    file: 'setup_doxygen.yml'

stages:
  - build
  - deploy
 
build:
  stage: build

  script:
    # Ensure the latest JSON artifacts are in ../json/install_dir
    - ./sheff_gitlab_ci/import_json.sh
    # Ensure the latest Eigen artifacts are in ../eigen/install_dir
    - ./sheff_gitlab_ci/import_eigen.sh
    # Ensure the latest JSON artifacts are in ../rapidjson/install_dir
    - ./sheff_gitlab_ci/import_rapidjson.sh

    # For 1st party and 2nd party modules:
    # Pull artifacts first from a branch with the same name as this branch, and if it fails then pull from development    
    
    # Ensure the latest second_party_metis artifacts are in ../second_party_metis/install_dir
    - ./sheff_gitlab_ci/import_second_party_metis.sh
    # Ensure the latest import_second_party_mesh artifacts are in ../import_second_party_mesh/install_dir
    - ./sheff_gitlab_ci/import_second_party_mesh.sh
    
    # Ensure the latest utility artifacts are in ../utility/install_dir
    - ./sheff_gitlab_ci/import_utility.sh
    # Ensure the latest utility artifacts are in ../utility/install_dir
    - ./sheff_gitlab_ci/import_fea_io.sh
    # Ensure the latest utility artifacts are in ../utility/install_dir
    - ./sheff_gitlab_ci/import_simple_math.sh

    - python3 make.py --config --build --verbose --make-tests --test
    - python3 make.py --config --build --verbose --make-tests --mode=RelWithDebInfo

